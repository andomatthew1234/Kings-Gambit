<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>King's Gambit</title>
<link rel="icon" type="image/png" href="resources/favicon.png">

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

<style>
body {
    font-family: Inter, sans-serif;
    box-sizing: border-box;
    padding: 1rem;
    display: flex;
    flex-direction: column;
    align-items: center;
}
#mainContent {
    width: 100%;
    max-width: 90rem;
}
#sidebar {
    position: relative;
    left: auto;
    top: auto;
    width: 100%;
    height: auto;
    margin-bottom: 1rem;
    z-index: 20;
}
.nav-item {
    display:flex;
    align-items:center;
    gap:0.75rem;
    width:100%;
    border-radius:0.75rem;
    border:1px solid rgba(75, 85, 99, 0.9);
    background:rgba(31, 41, 55, 0.9);
    color:#f9fafb;
    padding:0.9rem 1rem;
    text-align:left;
    font-size:0.95rem;
    font-weight:600;
    transition: all 0.2s ease;
}
.nav-item:hover {
    border-color:rgba(96, 165, 250, 0.9);
    background:rgba(37, 99, 235, 0.22);
    transform: translateX(2px);
}
.nav-item.active {
    border-color:rgba(96, 165, 250, 0.95);
    background:rgba(37, 99, 235, 0.28);
    box-shadow:0 0 0 1px rgba(96, 165, 250, 0.35);
}
#gameLayout {
    width: 100%;
    min-width: 0;
    justify-content: center;
}
#gameSidebar {
    min-width: 0;
    width: 100%;
}
.board {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);
    aspect-ratio: 1 / 1;
    width: min(100%, 52rem);
    max-width: 100%;
    min-width: 16rem;
}
@media (min-width: 1280px) {
    #sidebar {
        position: fixed;
        left: 1rem;
        top: 1rem;
        width: 18rem;
        height: calc(100vh - 2rem);
        margin-bottom: 0;
    }
    #mainContent {
        margin-left: calc(18rem + 2rem);
    }
    .board {
        width: min(calc(100vw - 22rem), 52rem);
    }
}
.square { display:flex; justify-content:center; align-items:center; font-size:2.5rem; cursor:pointer; }
.light { background:#f0d9b5; }
.dark { background:#b58863; }
.selected { background:#6b9ac4!important; }
.valid-move::after {
    content:'';
    width:30%;
    height:30%;
    background:rgba(0,0,0,.3);
    border-radius:50%;
    position:absolute;
}
</style>
</head>

<body class="bg-gray-900 text-white flex flex-col items-center p-4">

<div id="timer" class="absolute top-4 left-4 bg-gray-800 px-3 py-2 rounded text-sm leading-relaxed whitespace-pre-wrap shadow"></div>

<aside id="sidebar" class="bg-gray-950/95 border border-gray-700/80 rounded-2xl p-5 shadow-2xl backdrop-blur"
       aria-label="Primary navigation">
    <div class="flex items-center justify-between mb-5">
        <div>
            <p class="text-[10px] uppercase tracking-[0.28em] text-gray-400 font-bold">King's Gambit</p>
            <h2 class="mt-1 text-2xl font-bold text-white">Coach hub</h2>
        </div>
        <span class="rounded-full bg-blue-500/20 px-2 py-1 text-[9px] font-bold uppercase tracking-[0.2em] text-blue-200">Live</span>
    </div>

    <div class="space-y-2">
        <button id="navNewMatch" class="nav-item active" onclick="if(matchActive){exitMatch()} else if(currentView !== 'home'){showHomeView()} else {startGame()}">
            <img src="resources/create_match.png" alt="" class="h-5 w-5 object-contain">
            <span id="navNewMatchLabel">New match</span>
        </button>
        <button id="currentMatchItem" class="nav-item hidden" onclick="showGameView(); setActiveSidebarNav('currentMatchItem');">
            <img src="resources/current_match.png" alt="" class="h-5 w-5 object-contain">
            <span>Current match</span>
        </button>
    </div>

    <div class="mt-6">
        <p class="mb-2 text-[10px] font-bold uppercase tracking-[0.28em] text-gray-400"># Statistics and coach</p>
        <div class="space-y-2">
            <button id="navStats" class="nav-item" onclick="showStats();">
                <img src="resources/stats.png" alt="" class="h-5 w-5 object-contain">
                <span>Stats</span>
            </button>
            <button id="navPuzzles" class="nav-item" onclick="setActiveSidebarNav('navPuzzles'); showComingSoon('Puzzles');">
                <img src="resources/puzzles.png" alt="" class="h-5 w-5 object-contain">
                <span>Puzzles</span>
            </button>
            <button id="navCoach" class="nav-item" onclick="setActiveSidebarNav('navCoach'); showComingSoon('AI coach');">
                <img src="resources/ai.png" alt="" class="h-5 w-5 object-contain">
                <span>AI coach</span>
            </button>
        </div>
    </div>

    <div class="mt-6 rounded-xl border border-gray-700 bg-gray-800/80 p-3">
        <p class="text-[10px] uppercase tracking-[0.26em] text-gray-400">Sidebar status</p>
        <p id="sidebarStatus" class="mt-2 text-sm text-gray-200">Start a new match to unlock the live board.</p>
        <p class="mt-3 text-[10px] uppercase tracking-[0.26em] text-gray-400">Coach message</p>
        <p id="coachMessage" class="mt-1 text-sm text-amber-200">The board awaits. Make your first move.</p>
    </div>
</aside>

<div id="mainContent">
<div id="home" class="w-full max-w-sm text-center mt-20">
    <h1 class="text-5xl mb-6 font-bold">King's Gambit</h1>
    
    <div class="mb-6 text-left bg-gray-800 p-4 rounded shadow">
        <label class="block mb-2 font-bold">Bot Difficulty: <span id="diffDisplay">100</span></label>
        <input type="range" id="diffInput" min="1" max="100" value="100" class="w-full cursor-pointer" oninput="document.getElementById('diffDisplay').innerText = this.value">
        <p class="text-xs text-gray-400 mt-2">100 allows the bot maximum calculation time and depth.</p>
    </div>

    <button id="newGameButton" onclick="if(matchActive){exitMatch()} else {startGame()}" class="bg-blue-600 hover:bg-blue-500 transition px-4 py-3 rounded w-full mb-3 font-bold shadow flex items-center justify-center gap-2">
        <img src="resources/create_match.png" alt="" class="h-5 w-5 object-contain">
        <span id="newGameButtonLabel">New Game</span>
    </button>
    <button onclick="showStats()" class="bg-green-600 hover:bg-green-500 transition px-4 py-3 rounded w-full font-bold shadow flex items-center justify-center gap-2">
        <img src="resources/stats.png" alt="" class="h-5 w-5 object-contain">
        <span>Stats</span>
    </button>
</div>

<div id="stats" class="hidden text-center mt-20 w-full max-w-sm"></div>

<div id="gameDiv" class="hidden flex flex-col items-center w-full max-w-[95vw] mt-10">
    <div id="status" class="mb-4 text-xl font-bold bg-gray-800 px-6 py-2 rounded shadow">White to move</div>
    <div id="gameLayout" class="flex flex-col xl:flex-row items-start gap-6 w-full">
        <div id="board" class="board border-4 border-gray-800 rounded shadow-2xl relative"></div>
        <div id="gameSidebar" class="flex flex-col gap-4 w-full max-w-sm">
            <button id="resignButton" class="hidden bg-red-600 hover:bg-red-500 text-white transition px-4 py-3 rounded font-bold shadow w-full" onclick="resignMatch()">
                Resign match
            </button>
            <div class="rounded-2xl border border-gray-700 bg-gray-950/90 p-4 text-left">
                <p class="mb-3 text-sm uppercase tracking-[0.24em] text-gray-400 font-bold">Recent moves</p>
                <div id="moveHistory" class="space-y-2 text-sm text-gray-200 max-h-[34rem] overflow-y-auto"></div>
            </div>
        </div>
    </div>
</div>
</div>

<script>
// DOM Elements
const homeEl = document.getElementById('home');
const statsEl = document.getElementById('stats');
const gameDivEl = document.getElementById('gameDiv');
const boardEl = document.getElementById('board');
const resignButtonEl = document.getElementById('resignButton');
const moveHistoryEl = document.getElementById('moveHistory');
const timerEl = document.getElementById('timer');
const statusEl = document.getElementById('status');
const diffInputEl = document.getElementById('diffInput');
const sidebarStatusEl = document.getElementById('sidebarStatus');
const coachMessageEl = document.getElementById('coachMessage');
const currentMatchItemEl = document.getElementById('currentMatchItem');
const navNewMatchLabelEl = document.getElementById('navNewMatchLabel');
const newGameButtonLabelEl = document.getElementById('newGameButtonLabel');

const game = new Chess();
let selected = null;
let matchActive = false;
let validMoves = [];
let isGameOver = false;
let difficulty = 100;
let currentView = 'home';
const coachMessages = [
    "That pawn is looking sharp — don't let it grow into a threat.",
    "A tactical blunder is always one move away. Stay focused.",
    "Your queen wants room. Give her a lane and watch the pressure build.",
    "That bishop is out of line. Rotate your pieces and regain control.",
    "The center is the battlefield. Hold it, and the game bends to you.",
    "Careful — your king is exposed. The board doesn't forgive hesitation.",
    "Nice tempo. Keep the initiative and force the bot to react.",
    "That move was ambitious. Let's see if the opponent can handle the pressure."
];

function setSidebarStatus(message){
    if(sidebarStatusEl) sidebarStatusEl.textContent = message;
}

function setCoachMessage(message){
    if(coachMessageEl) coachMessageEl.textContent = message;
}

function showCoachMessage(){
    const index = Math.floor(Math.random() * coachMessages.length);
    setCoachMessage(coachMessages[index]);
}

function showHomeView(){
    currentView = 'home';
    matchActive = false;
    isGameOver = true;
    game.reset();
    selected = null;
    validMoves = [];
    homeEl.classList.remove('hidden');
    statsEl.classList.add('hidden');
    gameDivEl.classList.add('hidden');
    updateSidebarState();
}

function showGameView(){
    currentView = 'game';
    homeEl.classList.add('hidden');
    statsEl.classList.add('hidden');
    gameDivEl.classList.remove('hidden');
    updateSidebarState();
}

function showStatsView(){
    currentView = 'stats';
    matchActive = false;
    isGameOver = true;
    game.reset();
    selected = null;
    validMoves = [];
    homeEl.classList.add('hidden');
    gameDivEl.classList.add('hidden');
    statsEl.classList.remove('hidden');
    setCoachMessage('Stats opened. Check your performance and keep sharpening your play.');
    updateSidebarState();
}

function setActiveSidebarNav(activeId){
    const navIds = ['navNewMatch', 'currentMatchItem', 'navStats', 'navPuzzles', 'navCoach'];
    navIds.forEach(id => {
        const el = document.getElementById(id);
        if(el) el.classList.remove('active');
    });

    const activeEl = document.getElementById(activeId);
    if(activeEl) activeEl.classList.add('active');
}

function showComingSoon(pageName){
    setSidebarStatus(`${pageName} is coming soon.`);
    setCoachMessage(`The ${pageName.toLowerCase()} board is still under construction. Stay tuned.`);
}

function exitMatch(){
    showHomeView();
    setCoachMessage('Match exited. The board is clear and the homepage is back in view.');
}

function updateSidebarState(){
    if(currentMatchItemEl){
        currentMatchItemEl.classList.toggle('hidden', !matchActive);
    }

    if(navNewMatchLabelEl){
        navNewMatchLabelEl.textContent = matchActive ? 'Exit match' : 'New match';
    }

    if(newGameButtonLabelEl){
        newGameButtonLabelEl.textContent = matchActive ? 'Exit match' : 'New Game';
    }

    if(matchActive){
        setSidebarStatus('Current match is active. Resume the board to continue the game.');
        setActiveSidebarNav('currentMatchItem');
    } else {
        if(currentView === 'stats'){
            setActiveSidebarNav('navStats');
            setSidebarStatus('Statistics dashboard is open.');
        } else {
            setActiveSidebarNav('navNewMatch');
            setSidebarStatus('Start a new match to unlock the live board.');
        }
    }

    if(resignButtonEl){
        resignButtonEl.classList.toggle('hidden', !matchActive);
    }
}

// ======================
// TIMER LOGIC
// ======================
let gameStart = 0;
let moveStart = 0;
let totalWhiteTime = 0;
let totalBlackTime = 0;

function startTimers(){
    gameStart = Date.now();
    moveStart = Date.now();
    totalWhiteTime = 0;
    totalBlackTime = 0;
    requestAnimationFrame(updateTimer);
}

function updateTimer(){
    if(isGameOver) return;

    let now = Date.now();
    let currentMoveTime = now - moveStart;
    
    let displayWhite = totalWhiteTime + (game.turn() === 'w' ? currentMoveTime : 0);
    let displayBlack = totalBlackTime + (game.turn() === 'b' ? currentMoveTime : 0);

    timerEl.innerHTML = `Total Game Time: ${((now - gameStart)/1000).toFixed(1)}s
Your Search Time: ${(displayWhite/1000).toFixed(1)}s
Bot Search Time: ${(displayBlack/1000).toFixed(1)}s`;
    
    requestAnimationFrame(updateTimer);
}

// ======================
// STATS (LOCAL)
// ======================
function getStats(){
    return JSON.parse(localStorage.getItem("stats")) || { games:0, wins:0, losses:0, draws:0, best:0 };
}
function saveStats(s){ localStorage.setItem("stats", JSON.stringify(s)); }

function showStats(){
    showStatsView();
    let s = getStats();
    statsEl.innerHTML = `
    <h1 class="text-4xl mb-6 font-bold">Dashboard</h1>
    <div class="grid grid-cols-2 gap-4 text-lg">
        <div class="bg-gray-800 p-4 rounded shadow">Games: ${s.games}</div>
        <div class="bg-gray-800 p-4 rounded shadow text-green-400">Wins: ${s.wins}</div>
        <div class="bg-gray-800 p-4 rounded shadow text-red-400">Losses: ${s.losses}</div>
        <div class="bg-gray-800 p-4 rounded shadow text-yellow-400">Draws: ${s.draws}</div>
        <div class="bg-gray-800 p-4 rounded shadow col-span-2 font-bold">
            Win Rate: ${s.games ? ((s.wins/s.games)*100).toFixed(1) : 0}%
        </div>
        <div class="bg-gray-800 p-4 rounded shadow col-span-2 font-bold text-blue-400">
            Highest Diff Beaten: ${s.best}
        </div>
    </div>
    <button onclick="showHomeView()" class="mt-6 bg-gray-700 hover:bg-gray-600 transition px-6 py-3 rounded font-bold w-full">Back to Menu</button>
    `;
}

// ======================
// ENGINE (ITERATIVE DEEPENING + MINIMAX + QUIESCENCE)
// ======================
const val = { p:100, n:320, b:330, r:500, q:900, k:20000 };

const centerBias = [
    [0, 0, 0, 0, 0, 0, 0, 0],
    [0, 5, 5, 5, 5, 5, 5, 0],
    [0, 5, 15, 20, 20, 15, 5, 0],
    [0, 5, 20, 30, 30, 20, 5, 0],
    [0, 5, 20, 30, 30, 20, 5, 0],
    [0, 5, 15, 20, 20, 15, 5, 0],
    [0, 5, 5, 5, 5, 5, 5, 0],
    [0, 0, 0, 0, 0, 0, 0, 0]
];

function evalBoard(){
    let total = 0;
    let b = game.board();
    for(let i=0; i<8; i++){
        for(let j=0; j<8; j++){
            let p = b[i][j];
            if(p) {
                let score = val[p.type];
                if (['n','b','p','q'].includes(p.type)) score += centerBias[i][j];
                total += p.color === 'w' ? score : -score;
            }
        }
    }
    return total;
}

function orderMoves(moves) {
    return moves.sort((a, b) => {
        let scoreA = 0, scoreB = 0;
        if (a.captured) scoreA = (10 * val[a.captured]) - val[a.piece];
        if (a.promotion) scoreA += 1000;
        
        if (b.captured) scoreB = (10 * val[b.captured]) - val[b.piece];
        if (b.promotion) scoreB += 1000;
        
        return scoreB - scoreA;
    });
}

function quiesce(alpha, beta, maximizing, timeoutLimit) {
    if (Date.now() > timeoutLimit) return evalBoard();
    
    let standPat = evalBoard();
    if (maximizing) {
        if (standPat >= beta) return beta;
        if (alpha < standPat) alpha = standPat;
    } else {
        if (standPat <= alpha) return alpha;
        if (beta > standPat) beta = standPat;
    }

    let moves = orderMoves(game.moves({verbose: true}).filter(m => m.captured));

    if (maximizing) {
        for (let m of moves) {
            game.move(m);
            let score = quiesce(alpha, beta, false, timeoutLimit);
            game.undo();
            if (score >= beta) return beta;
            if (score > alpha) alpha = score;
        }
        return alpha;
    } else {
        for (let m of moves) {
            game.move(m);
            let score = quiesce(alpha, beta, true, timeoutLimit);
            game.undo();
            if (score <= alpha) return alpha;
            if (score < beta) beta = score;
        }
        return beta;
    }
}

function minimax(depth, alpha, beta, maximizing, timeoutLimit){
    if (Date.now() > timeoutLimit) return evalBoard();

    if (depth === 0) return quiesce(alpha, beta, maximizing, timeoutLimit);
    
    if (game.game_over()) {
        if (game.in_checkmate()) return maximizing ? -99999 : 99999;
        return 0; 
    }

    let moves = orderMoves(game.moves({verbose: true}));

    if (maximizing) {
        let max = -Infinity;
        for (let m of moves) {
            game.move(m);
            let v = minimax(depth - 1, alpha, beta, false, timeoutLimit);
            game.undo();
            max = Math.max(max, v);
            alpha = Math.max(alpha, v);
            if (beta <= alpha) break;
        }
        return max;
    } else {
        let min = Infinity;
        for (let m of moves) {
            game.move(m);
            let v = minimax(depth - 1, alpha, beta, true, timeoutLimit);
            game.undo();
            min = Math.min(min, v);
            beta = Math.min(beta, v);
            if (beta <= alpha) break;
        }
        return min;
    }
}

function getBestMove(){
    let bestMove = null;
    let currentDepth = 1;
    let timeLimit = Date.now() + (difficulty === 100 ? 3000 : difficulty * 20);
    
    while (currentDepth <= 5 && Date.now() < timeLimit) {
        let tempBest = null;
        let bestVal = Infinity; 
        let moves = orderMoves(game.moves({verbose: true}));

        for (let m of moves) {
            game.move(m);
            let v = minimax(currentDepth - 1, -Infinity, Infinity, true, timeLimit);
            game.undo();

            if (v < bestVal) {
                bestVal = v;
                tempBest = m;
            }
        }
        
        if (Date.now() > timeLimit) break; 
        bestMove = tempBest;
        currentDepth++;
    }

    return bestMove || game.moves({verbose:true})[0];
}

// ======================
// BOARD RENDER
// ======================
const solidPieces = { p:'♟', r:'♜', n:'♞', b:'♝', q:'♛', k:'♚' };

function render(){
    boardEl.innerHTML = "";
    let b = game.board();

    for(let i=0; i<8; i++){
        for(let j=0; j<8; j++){
            let sq = document.createElement("div");
            let name = String.fromCharCode(97+j) + (8-i);

            sq.className = "square relative " + ((i+j)%2 ? "dark" : "light");
            sq.dataset.square = name;

            let p = b[i][j];
            if(p) {
                let pieceSpan = document.createElement("span");
                pieceSpan.textContent = solidPieces[p.type];
                pieceSpan.style.userSelect = "none";
                pieceSpan.style.cursor = "pointer";
                
                // Set explicit colors so pieces don't inherit the global white text
                if (p.color === 'w') { 
                    pieceSpan.style.color = "#ffffff";
                    pieceSpan.style.textShadow = "0px 1px 4px rgba(0,0,0,0.8), 0px 0px 2px #000"; 
                } else {
                    pieceSpan.style.color = "#000000";
                    pieceSpan.style.textShadow = "0px 1px 2px rgba(255,255,255,0.4)";
                }
                
                sq.appendChild(pieceSpan);
            }

            if(validMoves.includes(name)) sq.classList.add("valid-move");
            if(selected === name) sq.classList.add("selected");

            sq.onclick = () => clickSquare(name);
            boardEl.appendChild(sq);
        }
    }

    let isCheck = game.in_check() ? " (Check)" : "";
    statusEl.textContent = (game.turn() === 'w' ? "White's Turn" : "Black's Turn") + isCheck;
    renderMoveHistory();
}

function renderMoveHistory(){
    if(!moveHistoryEl) return;
    let history = game.history({verbose:true});
    if(!history.length){
        moveHistoryEl.innerHTML = '<div class="text-sm text-gray-400">No moves yet.</div>';
        return;
    }
    let html = '';
    for(let i = 0; i < history.length; i += 2){
        let white = history[i];
        let black = history[i+1];
        let moveNumber = Math.floor(i / 2) + 1;
        html += `<div class="grid grid-cols-[auto_1fr_auto] gap-2 items-center rounded-xl bg-gray-900/80 p-3 border border-gray-800">
                    <span class="text-gray-400">${moveNumber}.</span>
                    <span class="font-semibold">${white.san}</span>
                    <span class="text-gray-400">${black ? black.san : ''}</span>
                 </div>`;
    }
    moveHistoryEl.innerHTML = html;
}

function resignMatch(){
    if(!matchActive) return;
    matchActive = false;
    isGameOver = true;
    updateSidebarState();

    let s = getStats();
    s.games++;
    s.losses++;
    saveStats(s);

    statusEl.textContent = 'You resigned. Black wins.';
    setCoachMessage('Match resigned. The board will reset after the alert.');

    setTimeout(() => {
        alert('You resigned the match.');
        location.reload();
    }, 500);
}

// ======================
// CLICK HANDLING
// ======================
function clickSquare(sq){
    if(isGameOver || game.turn() === 'b') return; 

    let piece = game.get(sq);

    if(selected) {
        let moves = game.moves({square: selected, verbose: true});
        let move = moves.find(m => m.to === sq);

        if(move) {
            if(move.flags.includes('p') || move.flags.includes('np')) move.promotion = 'q';
            
            game.move(move);
            totalWhiteTime += (Date.now() - moveStart);
            selected = null;
            validMoves = [];
            moveStart = Date.now();
            showCoachMessage();
            
            render();
            statusEl.textContent = "Bot is thinking...";
            
            setTimeout(botMove, 50);
        } else {
            selected = null;
            validMoves = [];
            render();
        }
    } else if(piece && piece.color === 'w'){
        selected = sq;
        validMoves = game.moves({square: sq, verbose: true}).map(m => m.to);
        render();
    }
}

// ======================
// BOT CONTROLLER
// ======================
function botMove(){
    if(game.game_over()){
        endGame();
        return;
    }

    let move = getBestMove();
    game.move(move);
    showCoachMessage();

    totalBlackTime += (Date.now() - moveStart);
    moveStart = Date.now();
    render();

    if(game.game_over()) endGame();
}

// ======================
// START
// ======================
function startGame(){
    difficulty = parseInt(diffInputEl.value);
    matchActive = true;
    currentView = 'game';
    isGameOver = false;
    game.reset();
    selected = null;
    validMoves = [];
    homeEl.classList.add('hidden');
    statsEl.classList.add('hidden');
    gameDivEl.classList.remove('hidden');
    showCoachMessage();
    updateSidebarState();

    startTimers();
    render();
}

// ======================
// GAME END + REVIEW
// ======================
function endGame(){
    isGameOver = true;
    matchActive = false;
    updateSidebarState();

    let s = getStats();
    s.games++;

    let resultMsg = "Draw!";

    if(game.in_checkmate()){
        if(game.turn() === 'w'){ 
            s.losses++; 
            resultMsg = "Black Wins by Checkmate!";
        } else { 
            s.wins++; 
            s.best = Math.max(s.best, difficulty); 
            resultMsg = "White Wins by Checkmate!";
        }
    } else {
        s.draws++;
        if(game.in_stalemate()) resultMsg = "Draw by Stalemate!";
        else if(game.in_threefold_repetition()) resultMsg = "Draw by Repetition!";
        else if(game.insufficient_material()) resultMsg = "Draw by Insufficient Material!";
    }

    saveStats(s);
    statusEl.textContent = resultMsg;
    
    setTimeout(() => {
        alert(resultMsg);
        location.reload();
    }, 500);
}

updateSidebarState();
</script>

</body>
</html>
